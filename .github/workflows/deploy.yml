name: Test and deploy to GitHub Pages and VK Cloud
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # VK Cloud Object Storage, the app at the root of its own domain (via VK CDN). Off until the repo variable
  # VKCLOUD_BUCKET is set; keys in the secrets VKCLOUD_ACCESS_KEY / VKCLOUD_SECRET_KEY. Optional variables:
  # VKCLOUD_ENDPOINT (the S3 endpoint), VKCLOUD_BASE (the path the app lives at, "/" by default).
  vkcloud:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.VKCLOUD_BUCKET != ''
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.VKCLOUD_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VKCLOUD_SECRET_KEY }}
      AWS_DEFAULT_REGION: ru-msk
      # S3-compatible storages reject the newer default checksums of AWS CLI v2
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3: s3://${{ vars.VKCLOUD_BUCKET }}
      ENDPOINT: ${{ vars.VKCLOUD_ENDPOINT || 'https://hb.ru-msk.vkcloud-storage.ru' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.VKCLOUD_BASE || '/' }}
      # hashed files never change: cached for a year; old ones stay for clients still on the previous version.
      # The rest (index.html, sw.js, manifest, version.json, icons) is checked on every load, so an update shows up at once.
      - run: aws s3 sync dist/assets "$S3/assets" --endpoint-url "$ENDPOINT" --acl public-read --cache-control "public, max-age=31536000, immutable"
      - run: aws s3 sync dist "$S3" --endpoint-url "$ENDPOINT" --acl public-read --cache-control "no-cache" --exclude "assets/*" --delete
